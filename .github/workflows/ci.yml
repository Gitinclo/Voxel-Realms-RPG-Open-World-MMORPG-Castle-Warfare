name: CI — Fast PR Feedback
on:
  pull_request:
    branches: [main, master]
jobs:
  fast-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm install --no-audit
      - run: npm run validate
