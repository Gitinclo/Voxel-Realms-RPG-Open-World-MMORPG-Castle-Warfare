name: CI — PR Validation, Audit, Coverage, Live Ops & E2E Gate

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  validate-and-verify:
    name: Lockfile Integrity, Validate, Audit, Coverage & Live Ops Probe
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - name: Verify package-lock.json integrity matches package.json
        run: npm run lockfile:verify
      - name: Install deterministic dependencies
        run: npm ci --no-audit
      - name: Type-check, rules lint, Prettier, unit tests & production build
        run: npm run validate
      - name: High/Critical vulnerability audit gate
        run: npm audit --audit-level=high
      - name: Run unit, integration & security coverage report
        run: npm run test:coverage | tee coverage-summary.txt
      - name: Upload coverage report artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-coverage-report
          path: coverage-summary.txt
          if-no-files-found: error
          retention-days: 14
      - name: Live production-mode ops, ledger & multi-sector WS probe
        run: npm run verify:ops

  e2e-browser:
    name: Required E2E Browser Gate (Playwright Headless Chromium)
    needs: validate-and-verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - name: Verify package-lock.json integrity matches package.json
        run: npm run lockfile:verify
      - name: Install dependencies & build production bundle
        run: npm ci --no-audit && npm run build
      - name: Install matching fonts, Playwright chrome-for-testing binaries & CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-core fonts-noto-color-emoji
          sudo apt-get install -y --no-install-recommends fonts-jetbrains-mono || true
          fc-cache -f
          npx playwright install --with-deps chrome-for-testing
          npm install -g @playwright/cli
          playwright-cli install-browser chrome-for-testing --with-deps
      - name: Run required E2E verification suite
        run: npm run verify:e2e
      - name: Upload modal visual diff & failure screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ci-e2e-visual-diff-on-failure
          path: |
            .playwright-cli/visual-diff/
            .playwright-cli/modal-*.png
            .playwright-cli/e2e-failure.png
            .playwright-cli/*.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
      - name: Export E2E logs & screenshot artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-e2e-logs-and-screenshots
          path: .playwright-cli/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  docker-build:
    name: Production Multi-Stage Docker Build Gate
    needs: validate-and-verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build production Node.js container image
        run: docker build --target runner -t voxel-realms-rpg:ci .
      - name: Build static Nginx edge container image
        run: docker build --target nginx-runner -t voxel-realms-rpg-nginx:ci .
