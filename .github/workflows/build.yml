name: Guardrails — Build, Lint, Audit, Format & Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-check:
    name: Guardrails (Lint, Audit, Prettier, Unit Tests & Build)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --package-lock

      # 1. The Linter (catches messy code, syntax errors & unused variables)
      - name: Run Linter
        run: npm run lint

      # 2. The Deprecation & Vulnerability Checker (catches vulnerable/old libraries)
      - name: Check for vulnerabilities
        run: npm audit --audit-level=high

      # 3. The Formatter (enforces consistent code style across all files)
      - name: Check Formatting
        run: npx prettier --check .

      # 4. Automated Unit & Regression Tests (ensures old features still work)
      - name: Run Tests
        run: npm test

      # 5. Production Bundle Verification
      - name: Build production bundle
        run: npm run build

      - name: Upload production build artifact
        uses: actions/upload-artifact@v4
        with:
          name: voxel-realms-rpg-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14
