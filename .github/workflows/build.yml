name: Build, Test & Package Voxel Realms RPG

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Typecheck, Regression Tests & Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run TypeScript strict typecheck (Zero Spaghetti / No Implicit Breaks)
        run: npm run lint

      - name: Run automated unit & regression test suite (All 6 Game Subsystems)
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Verify production bundle integrity
        run: |
          test -f dist/index.html
          echo "Production build verified successfully."

      - name: Upload production build artifact
        uses: actions/upload-artifact@v4
        with:
          name: voxel-realms-rpg-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14
