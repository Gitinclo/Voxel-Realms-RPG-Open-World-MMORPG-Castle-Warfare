name: Guardrails — Build, Lint, Audit, Format & Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-check:
    name: Guardrails (Lint, Audit, Prettier, Unit Tests, Build & Live Ops Verification)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Verify package-lock.json integrity matches package.json
        run: npm run lockfile:verify

      - name: Install dependencies
        run: npm ci --no-audit

      # 1. Strict TypeScript & Firestore Security Rules Linting
      - name: Run Linter
        run: npm run lint && npm run lint:rules

      # 2. The Deprecation & Vulnerability Checker (catches vulnerable/old libraries)
      - name: Check for vulnerabilities
        run: npm audit --audit-level=high

      # 3. The Formatter (enforces consistent code style across all files)
      - name: Check Formatting
        run: npx prettier --check .

      # 4. Automated Unit, Integration & Firestore Rules Tests
      - name: Run Tests
        run: npm test

      # 5. Production Bundle Verification
      - name: Build production bundle
        run: npm run build

      # 6. Live Production Server Load, Exploit Resistance, Crash Recovery & SIGTERM Readiness
      - name: Run Live Server Operational Readiness Suite
        run: npm run verify:ops

      - name: Upload production build artifact
        uses: actions/upload-artifact@v7
        with:
          name: voxel-realms-rpg-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14

  docker-build:
    name: Container Verification (Multi-Stage Node 26 Alpine + E2E Stage)
    needs: quality-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js for lockfile integrity gate
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Verify package-lock.json integrity matches package.json
        run: npm run lockfile:verify

      - name: Build production Node runner image
        run: docker build --target runner -t voxel-realms-rpg:ci .

      - name: Build optional Nginx static edge image
        run: docker build --target nginx-runner -t voxel-realms-rpg:nginx-ci .

      - name: Build Playwright E2E browser image
        run: docker build --target e2e-runner -t voxel-realms-rpg:e2e-ci .

  e2e-browser:
    name: Required Real Browser E2E Gate (Headless Chromium)
    needs: quality-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Verify package-lock.json integrity matches package.json
        run: npm run lockfile:verify

      - name: Install dependencies & build production bundle
        run: npm ci --no-audit && npm run build

      - name: Install matching fonts, Playwright chrome-for-testing binaries & CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-core fonts-noto-color-emoji
          sudo apt-get install -y --no-install-recommends fonts-jetbrains-mono || true
          fc-cache -f
          npx playwright install --with-deps chrome-for-testing
          npm install -g @playwright/cli
          playwright-cli install-browser chrome-for-testing --with-deps

      - name: Run real headless Chromium E2E suite
        run: npm run verify:e2e

      - name: Upload modal visual diff & failure screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: voxel-realms-e2e-visual-diff-on-failure
          path: |
            .playwright-cli/visual-diff/
            .playwright-cli/modal-*.png
            .playwright-cli/e2e-failure.png
            .playwright-cli/*.log
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

      - name: Export E2E logs & screenshot artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: voxel-realms-e2e-artifacts
          path: .playwright-cli/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  cpp20-guardrails:
    name: C++20 Guardrails (Clang-Format, Clang-Tidy, vcpkg & CTest)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Clang-Format, Clang-Tidy & CMake
        run: |
          sudo apt-get update
          sudo apt-get install -y clang clang-format clang-tidy cmake ninja-build jq

      # 1. C++ Package Manager Manifest Audit (vcpkg.json baseline & dependency lock check)
      - name: Verify vcpkg.json Manifest & Baseline Pinning
        run: |
          jq -e '.["builtin-baseline"] and (.dependencies | length >= 4)' vcpkg.json

      # 2. C++ Formatter Check (enforces .clang-format LLVM 4-space 100-col standard)
      - name: Run Clang-Format Check (.clang-format)
        run: |
          clang-format --dry-run --Werror cpp/VoxelRealmsGuardrails.hpp cpp/engine_guardrail_test.cpp

      # 3. Configure C++20 Build & Export compile_commands.json
      - name: Configure CMake (ISO C++20 Strict Mode)
        run: |
          cmake -B build -G Ninja -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=Release

      # 4. C++ Linter / Static Analyzer (catches raw pointers, memory leaks & modernizes to C++20)
      - name: Run Clang-Tidy Static Analyzer (.clang-tidy)
        run: |
          clang-tidy -p build cpp/engine_guardrail_test.cpp

      # 5. Build & Execute C++20 Guardrail Unit Tests
      - name: Build & Run C++20 Engine Tests (CTest)
        run: |
          cmake --build build
          ctest --test-dir build --output-on-failure
