name: Release — Package WebGL/Server Builds, SBOM, Provenance & GitHub Release
# Policy:
#   - Protected GitHub Environment `production-release` should require >= 2 independent reviewers.
#   - Maintainers MUST create GPG/SSH-signed tags locally (`git tag -s vX.Y.Z`) only after completing
#     all 24 gates in docs/release-evidence-template.md and runbooks/release-cut.md.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  publish-release:
    name: Verify Signed Tag, Package Release Builds (<2GB), SBOM & Publish
    runs-on: ubuntu-latest
    environment: production-release
    timeout-minutes: 35

    steps:
      - name: Checkout tagged source (full tag metadata)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify SemVer tag format, annotation & GPG/SSH signature
        id: tag_meta
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if ! [[ "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "ERROR: Tag ${TAG} must follow Semantic Versioning (e.g. v0.1.0, v1.5.0, v1.5.0-beta.1)."
            exit 1
          fi
          TAG_TYPE="$(git cat-file -t "${TAG}")"
          if [ "${TAG_TYPE}" != "tag" ]; then
            echo "ERROR: ${TAG} is a lightweight tag. Only signed annotated tags (git tag -s) may trigger a release."
            exit 1
          fi
          if ! git cat-file -p "${TAG}" | grep -qE 'BEGIN (PGP|SSH) SIGNATURE'; then
            echo "ERROR: Annotated tag ${TAG} is unsigned. Sign with GPG or SSH before pushing."
            exit 1
          fi
          IS_PRERELEASE="false"
          if [[ "${TAG}" == *-* ]]; then
            IS_PRERELEASE="true"
          fi
          echo "is_prerelease=${IS_PRERELEASE}" >> "${GITHUB_OUTPUT}"
          echo "Verified signed SemVer tag ${TAG} (prerelease=${IS_PRERELEASE})."

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Verify package.json version matches Git tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "Git tag version: ${TAG_VERSION} | package.json version: ${PKG_VERSION}"
          if [ "${TAG_VERSION}" != "${PKG_VERSION}" ]; then
            echo "Mismatch: push tag v${PKG_VERSION} or update package.json before releasing."
            exit 1
          fi

      - name: Run full validation, audit, live ops & E2E verification
        run: |
          npm run validate
          npm audit --audit-level=high
          npm run verify:ops
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-core fonts-noto-color-emoji
          sudo apt-get install -y --no-install-recommends fonts-jetbrains-mono || true
          fc-cache -f
          npx playwright install --with-deps chrome-for-testing
          npm install -g @playwright/cli
          playwright-cli install-browser chrome-for-testing --with-deps
          npm run verify:e2e

      - name: Build production Docker image & scan with Trivy
        run: docker build -t "voxel-realms-rpg:${GITHUB_REF_NAME}" .

      - name: Trivy container vulnerability scan (fail on CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: voxel-realms-rpg:${{ github.ref_name }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Package Offline WebGL Release Zip & Player-Facing Release Notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: npm run release:package

      - name: Package Full-Stack Linux Server Release Bundle
        run: |
          set -euo pipefail
          mkdir -p release-assets
          ARCHIVE="release-assets/VoxelRealmsRPG-${GITHUB_REF_NAME}-Linux.tar.gz"
          tar -czf "${ARCHIVE}" \
            dist \
            server.ts \
            Dockerfile \
            .dockerignore \
            nginx.conf \
            k8s \
            loadtest \
            runbooks \
            docs \
            DEPLOYMENT.md \
            badges.md \
            package.json \
            package-lock.json \
            bun.lock \
            tsconfig.json \
            firebase-applet-config.json \
            firebase-blueprint.json \
            firestore.rules \
            src/game \
            src/db \
            src/server \
            src/middleware \
            src/types \
            src/lib/firebase-admin.ts \
            README.md \
            ARCHITECTURE.md \
            CHANGELOG.md \
            CODE_OF_CONDUCT.md \
            CONTRIBUTING.md \
            EULA.md \
            GOVERNANCE.md \
            LEGAL.md \
            LICENSE \
            LICENSE.md \
            NOTICE \
            PRIVACY.md \
            ROADMAP.md \
            SECURITY.md \
            SUPPORT.md \
            TERMS.md

      - name: Generate CycloneDX SBOM (SBOM.cdx.json) via Syft
        uses: anchore/sbom-action@v0
        with:
          image: voxel-realms-rpg:${{ github.ref_name }}
          format: cyclonedx-json
          output-file: release-assets/SBOM.cdx.json

      - name: Generate SPDX SBOM (SBOM.spdx.json) via Syft
        uses: anchore/sbom-action@v0
        with:
          image: voxel-realms-rpg:${{ github.ref_name }}
          format: spdx-json
          output-file: release-assets/SBOM.spdx.json

      - name: Generate build provenance & release attestation metadata
        run: |
          node -e '
            const fs = require("fs");
            const crypto = require("crypto");
            const tag = process.env.GITHUB_REF_NAME;
            const webglZip = `release-assets/VoxelRealmsRPG-${tag}-WebGL.zip`;
            const linuxArchive = `release-assets/VoxelRealmsRPG-${tag}-Linux.tar.gz`;
            const sha = (p) => crypto.createHash("sha256").update(fs.readFileSync(p)).digest("hex");
            const webglDigest = sha(webglZip);
            const linuxDigest = sha(linuxArchive);
            const provenance = {
              _type: "https://in-toto.io/Statement/v1",
              predicateType: "https://slsa.dev/provenance/v1",
              subject: [
                { name: webglZip.split("/").pop(), digest: { sha256: webglDigest } },
                { name: linuxArchive.split("/").pop(), digest: { sha256: linuxDigest } }
              ],
              predicate: {
                buildDefinition: {
                  buildType: "https://github.com/actions/runner",
                  externalParameters: {
                    repository: process.env.GITHUB_REPOSITORY,
                    ref: process.env.GITHUB_REF,
                    workflow: process.env.GITHUB_WORKFLOW
                  }
                },
                runDetails: {
                  builder: { id: "https://github.com/actions/runner" },
                  metadata: {
                    invocationId: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
                    startedOn: new Date().toISOString()
                  }
                }
              }
            };
            fs.writeFileSync("release-assets/provenance.json", JSON.stringify(provenance, null, 2));
            fs.writeFileSync(
              "release-assets/release-attestation.json",
              JSON.stringify({
                tag,
                commitSha: process.env.GITHUB_SHA,
                webglZipSha256: webglDigest,
                linuxServerSha256: linuxDigest,
                sbomFormats: ["SBOM.cdx.json", "SBOM.spdx.json"],
                trivyGate: "CRITICAL,HIGH=0",
                e2eVerified: true,
                opsVerified: true,
                signedTagChecked: true,
                generatedAtIso: new Date().toISOString()
              }, null, 2)
            );
          '

      - name: Enforce strict < 2 GB GitHub Release asset limit & compute SHA256SUMS.txt
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const path = require("path");
            const LIMIT = 2 * 1024 * 1024 * 1024;
            for (const f of fs.readdirSync("release-assets")) {
              const p = path.join("release-assets", f);
              const st = fs.statSync(p);
              if (!st.isFile()) continue;
              if (st.size <= 0 || st.size >= LIMIT) {
                console.error(`FAIL: ${f} (${st.size} bytes) violates < 2 GB GitHub Release asset limit.`);
                process.exit(1);
              }
            }
            console.log("All release assets verified strictly under 2 GB.");
          '
          (cd release-assets && sha256sum VoxelRealmsRPG-*.zip VoxelRealmsRPG-*.tar.gz SBOM.cdx.json SBOM.spdx.json provenance.json release-attestation.json > SHA256SUMS.txt)

      - name: Attest build provenance via GitHub Artifact Attestations
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release-assets/VoxelRealmsRPG-*.zip
            release-assets/VoxelRealmsRPG-*.tar.gz
            release-assets/SBOM.cdx.json
            release-assets/SBOM.spdx.json
            release-assets/SHA256SUMS.txt

      - name: Publish GitHub Release via softprops/action-gh-release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: release-assets/RELEASE_NOTES_PLAYER.md
          prerelease: ${{ steps.tag_meta.outputs.is_prerelease == 'true' }}
          fail_on_unmatched_files: true
          files: |
            release-assets/VoxelRealmsRPG-${{ github.ref_name }}-WebGL.zip
            release-assets/VoxelRealmsRPG-${{ github.ref_name }}-Linux.tar.gz
            release-assets/SHA256SUMS.txt
            release-assets/SBOM.cdx.json
            release-assets/SBOM.spdx.json
            release-assets/provenance.json
            release-assets/release-attestation.json
