name: CD — Staging Validation Gate
on:
  workflow_dispatch:
jobs:
  verify-release-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit
      - run: npm run validate && npm run verify:ops
