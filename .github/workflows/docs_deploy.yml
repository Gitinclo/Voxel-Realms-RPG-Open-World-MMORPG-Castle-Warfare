name: Documentation Integrity & Pages Build

on:
  push:
    branches:
      - main
    paths:
      - '**.md'
      - 'docs/**'
      - '.github/workflows/docs_deploy.yml'
  pull_request:
    paths:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-deploy
  cancel-in-progress: true

jobs:
  verify-docs:
    name: Verify Markdown Formatting & Relative Links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check Prettier Markdown Formatting
        run: npx prettier --check "**/*.md"

      - name: Verify Relative Markdown File Links Resolve on Disk
        run: |
          node -e '
          const fs = require("fs");
          const path = require("path");
          const readme = fs.readFileSync("README.md", "utf8");
          const linkRegex = /\]\(\.\/([^)#]+)(?:#[^)]+)?\)/g;
          const broken = [];
          for (const match of readme.matchAll(linkRegex)) {
            const relPath = decodeURIComponent(match[1]);
            if (!fs.existsSync(path.resolve(relPath))) {
              broken.push(relPath);
            }
          }
          if (broken.length > 0) {
            console.error("Broken README links:", broken);
            process.exit(1);
          }
          console.log("All relative README documentation links verified.");
          '
