name: GitHub Pages — Playable WebGL Release Build
# Publishes the production WebGL Release bundle to GitHub Pages so players can run
# Voxel Realms RPG directly in the browser.
# Prerequisite: Enable GitHub Pages -> Source: "GitHub Actions" in Repository Settings.

on:
  push:
    branches:
      - main
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-webgl
  cancel-in-progress: true

jobs:
  build-webgl:
    name: Build Release WebGL Bundle for GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      pages_enabled: ${{ steps.pages.outcome == 'success' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js 26
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Configure GitHub Pages
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v6
        with:
          enablement: true
          token: ${{ secrets.PAGES_ENABLEMENT_TOKEN || github.token }}

      - name: Build production WebGL bundle with Pages base path
        env:
          NODE_ENV: production
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: |
          npm run build
          touch dist/.nojekyll
          cp dist/index.html dist/404.html

      - name: Upload GitHub Pages artifact
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Report GitHub Pages enablement instructions when not yet enabled
        if: steps.pages.outcome != 'success'
        run: |
          {
            echo "### GitHub Pages WebGL Bundle Built — Awaiting Repository Pages Enablement"
            echo ""
            echo "The production WebGL bundle compiled cleanly for \`/${{ github.event.repository.name }}/\`, but GitHub Pages is not yet enabled on this repository (and the default \`GITHUB_TOKEN\` cannot enable Pages for the first time)."
            echo ""
            echo "**One-time setup:** Open **Settings → Pages → Build and deployment → Source** and select **GitHub Actions**, then re-run this workflow (or push to \`main\`) to publish live."
          } >> "${GITHUB_STEP_SUMMARY}"

  deploy-webgl:
    name: Deploy Playable WebGL Build to GitHub Pages
    needs: build-webgl
    if: needs.build-webgl.outputs.pages_enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
