# Voxel Realms RPG — Staging Kustomize Overlay
# Apply via: kubectl apply -k k8s/overlays/staging
# IMPORTANT: Replace the staging domain/project/cluster values in patches/*.yaml with your
# actual staging GCP project, GKE cluster name, and registered staging DNS hostname before applying.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: voxel-realms

resources:
  - ../../base

commonLabels:
  app.kubernetes.io/environment: staging

patches:
  - path: patches/config-patch.yaml
  - path: patches/service-account-patch.yaml
  - path: patches/external-secret-patch.yaml
  - path: patches/ingress-patch.yaml
  - path: patches/deployment-patch.yaml
