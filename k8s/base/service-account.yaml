# Voxel Realms RPG — Workload Identity ServiceAccount
# Bind the annotated GCP Service Account to:
#   - roles/cloudsql.client
#   - roles/secretmanager.secretAccessor
#   - roles/iam.workloadIdentityUser (for serviceAccount:<PROJECT>.svc.id.goog[voxel-realms/voxel-realms-sa])
# The exact GCP service account email is patched in k8s/overlays/{staging,production}.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: voxel-realms-sa
  namespace: voxel-realms
  labels:
    app.kubernetes.io/name: voxel-realms-rpg
  annotations:
    iam.gke.io/gcp-service-account: 'SET_IN_ENVIRONMENT_OVERLAY'
automountServiceAccountToken: true
