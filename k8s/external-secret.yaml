# Voxel Realms RPG — External Secrets Operator (GCP Secret Manager Integration)
# Prerequisite: External Secrets Operator (>= v0.10) installed in cluster, and
# `voxel-realms-sa` bound via GKE Workload Identity to `roles/secretmanager.secretAccessor`.
# This replaces any raw Kubernetes `Secret` with `stringData`.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: gcp-secret-manager
  namespace: voxel-realms
  labels:
    app.kubernetes.io/name: voxel-realms-rpg
spec:
  provider:
    gcpsm:
      # Patched per environment in k8s/overlays/{staging,production}/patches/external-secret-patch.yaml
      projectID: 'SET_IN_ENVIRONMENT_OVERLAY'
      auth:
        workloadIdentity:
          clusterLocation: 'asia-southeast1'
          clusterName: 'SET_IN_ENVIRONMENT_OVERLAY'
          serviceAccountRef:
            name: voxel-realms-sa
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: voxel-realms-secrets
  namespace: voxel-realms
  labels:
    app.kubernetes.io/name: voxel-realms-rpg
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: gcp-secret-manager
    kind: SecretStore
  target:
    name: voxel-realms-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: VOXEL_SESSION_SECRET
      remoteRef:
        key: voxel-realms-session-secret
        version: latest
    - secretKey: VOXEL_ADMIN_PASSKEY
      remoteRef:
        key: voxel-realms-admin-passkey
        version: latest
    - secretKey: SQL_USER
      remoteRef:
        key: voxel-realms-sql-user
        version: latest
    - secretKey: SQL_PASSWORD
      remoteRef:
        key: voxel-realms-sql-password
        version: latest
    - secretKey: REDIS_REST_URL
      remoteRef:
        key: voxel-realms-redis-rest-url
        version: latest
    - secretKey: REDIS_REST_TOKEN
      remoteRef:
        key: voxel-realms-redis-rest-token
        version: latest
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: voxel-realms-redis-password
        version: latest
    - secretKey: REDIS_INTERNAL_TLS_URI
      remoteRef:
        key: voxel-realms-redis-internal-tls-uri
        version: latest
