# Voxel Realms RPG — Redis + REST Coordination Sidecar for Multi-Instance Session Revocation
# For managed cloud deployments, replace this StatefulSet with GCP Memorystore for Redis
# or Upstash Redis REST and point REDIS_REST_URL/REDIS_REST_TOKEN in voxel-realms-secrets.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: voxel-redis
  namespace: voxel-realms
  labels:
    app.kubernetes.io/name: voxel-redis
spec:
  serviceName: voxel-redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: voxel-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: voxel-redis
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7.4-alpine
          args:
            - 'redis-server'
            - '--appendonly'
            - 'yes'
            - '--maxmemory'
            - '256mb'
            - '--maxmemory-policy'
            - 'volatile-ttl'
          ports:
            - name: redis
              containerPort: 6379
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ['ALL']
          resources:
            requests:
              cpu: '100m'
              memory: '128Mi'
            limits:
              cpu: '500m'
              memory: '384Mi'
          livenessProbe:
            exec:
              command: ['redis-cli', 'ping']
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ['redis-cli', 'ping']
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: redis-data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: redis-data
      spec:
        accessModes: ['ReadWriteOnce']
        resources:
          requests:
            storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: voxel-redis
  namespace: voxel-realms
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: voxel-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
