# Voxel Realms RPG — TLS 1.3 Ingress & cert-manager ClusterIssuer (HTTP + 20Hz /ws/siege WebSocket)
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    email: creatergame31@gmail.com
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: voxel-realms-ingress
  namespace: voxel-realms
  annotations:
    cert-manager.io/cluster-issuer: 'letsencrypt-prod'
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/force-ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '3600'
    nginx.ingress.kubernetes.io/proxy-send-timeout: '3600'
    nginx.ingress.kubernetes.io/websocket-services: 'voxel-realms-service'
    nginx.ingress.kubernetes.io/affinity: 'cookie'
    nginx.ingress.kubernetes.io/session-cookie-name: 'vr_route_affinity'
    nginx.ingress.kubernetes.io/session-cookie-samesite: 'Lax'
    nginx.ingress.kubernetes.io/limit-rps: '60'
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - voxelrealms.example.com
      secretName: voxel-realms-tls-cert
  rules:
    - host: voxelrealms.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: voxel-realms-service
                port:
                  name: http
